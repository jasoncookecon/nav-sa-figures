[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arbscanner"
version = "0.1.0"
description = "Read-only scanner that hunts for cross-platform arbitrage in prediction markets."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
arbscanner = "arbscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
